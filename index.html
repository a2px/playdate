<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playdate</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <div id="hero">
    <div><h1>Playdate</h1><p class="tag">Meet in the middle. Fair and square.</p></div>
    <div id="hero-figs"></div>
  </div>
  <form id="search" autocomplete="off">
    <div class="field"><span id="fig-you"></span><label for="you">You</label>
      <div class="locwrap"><input id="you" placeholder="Your address" enterkeyhint="next">
      <button id="locate" type="button" title="Use my location" aria-label="Use my location"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="#111" stroke-width="3"/><circle cx="12" cy="12" r="2.2" fill="#e8302a"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg></button></div></div>
    <div id="lochint"></div>
    <div class="field"><span id="fig-friend"></span><label for="friend">Friend</label><input id="friend" placeholder="Friend's address" enterkeyhint="go"></div>
    <div class="modes" id="modes">
      <button type="button" data-mode="drive" class="on">Driving</button>
      <button type="button" data-mode="transit">Public transit</button>
    </div>
    <button id="go" type="submit">Find our spot!</button>
  </form>
  <div id="results"></div>
</div>
<div id="map"></div>
<script src="app.js"></script>
</body>
</html>
